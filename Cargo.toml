[workspace]
resolver = "2"
members = [
    "crates/fovea-core",
    "crates/fovea-capture",
    "crates/fovea-render",
    "crates/fovea-ai",
    "crates/fovea-mcp",
    "crates/fovea-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/vunamhung/fovea"

[workspace.dependencies]
fovea-core = { path = "crates/fovea-core" }
fovea-capture = { path = "crates/fovea-capture" }

gpui-kit = { version = "0.11.0", default-features = false, features = ["component", "assets"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
debug = "limited"
split-debuginfo = "unpacked"

[profile.dev.package]
gpui-pre = { opt-level = 2 }
gpui-pre-platform = { opt-level = 2 }
taffy = { opt-level = 2 }
resvg = { opt-level = 2 }
rustybuzz = { opt-level = 2 }

[profile.release]
lto = "thin"
strip = "symbols"
codegen-units = 1
