[package]
name = "fovea-capture"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
fovea-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
dispatch2 = "0.3"
objc2 = "0.6"
objc2-av-foundation = { version = "0.3.2", features = [
    "AVAssetWriter",
    "AVAssetWriterInput",
    "AVCaptureDevice",
    "AVMediaFormat",
    "AVVideoSettings",
    "block2",
    "objc2-core-media",
] }
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-core-media = { version = "0.3.2", features = ["CMSampleBuffer", "CMTime"] }
objc2-foundation = { version = "0.3.2", features = [
    "NSArray",
    "NSDictionary",
    "NSError",
    "NSString",
    "NSURL",
    "NSValue",
] }
objc2-screen-capture-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "SCShareableContent",
    "SCStream",
    "block2",
    "dispatch2",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "objc2-core-media",
] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
